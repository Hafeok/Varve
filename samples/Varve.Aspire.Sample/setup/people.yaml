# The people dataset's setup (ADR 0130), applied by `varve setup apply` from the
# server's image once the server is healthy (ADR 0131). Applying it again
# commits nothing.
dataset: people
baseline:
  - name: vocabulary
    file: vocabulary.ttl
    graph: https://people.example/vocabulary
migrations:
  - id: 2026-10-13-founder
    update: |
      INSERT DATA { <https://people.example/people/1> <http://xmlns.com/foaf/0.1/name> "The founder" }
