# The Event Hubs emulator and the Azurite it keeps its metadata and
# checkpoints in, for the Event Hubs bridge sample's test (ADR 0146): started
# by the samples-eventhubs job, never by a test or a package (ADR 0099).
#
#   docker compose -f .github/eventhubs/compose.yaml up -d --wait
#   curl --retry 60 --retry-delay 3 --retry-all-errors --fail http://localhost:5300/health
#
# The emulator's image has no shell, so it carries no healthcheck: --wait
# waits for the containers to run, and the health endpoint on 5300, probed
# from the host, answers 200 once the namespace and its entities exist.
#
# The connection string a process on the host uses is the emulator's
# documented development one:
#
#   Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
#
# Config.json beside this file declares one event hub, varve-events, with two
# partitions and the consumer group the test reads with.
#
# ACCEPT_EULA=Y accepts the emulator's licence
# (https://github.com/Azure/azure-event-hubs-emulator-installer/blob/main/EMULATOR_EULA.md)
# for a container run in CI; nothing of it is linked or shipped.
#
# Images are pinned by digest, resolved from mcr.microsoft.com when this file
# was written (2026-10-15); the tag beside each is for the reader. Dependabot's
# docker-compose ecosystem bumps them.

name: varve-eventhubs

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      eventhubs:
        aliases:
          - azurite

  emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:2.2.1@sha256:be413f0d59541621879e6d197d73f64f3b3ac5fa45861641fdc1430252b8b44b
    volumes:
      - ./Config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y"
    depends_on:
      - azurite
    networks:
      eventhubs:
        aliases:
          - eventhubs-emulator

networks:
  eventhubs:
