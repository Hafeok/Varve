# repo-standard declaration for Hafeok/Varve
# Written by `repo-standard export` 0.1.0. Secrets are names only; values are never read.
# Remove a top-level key to stop managing that kind of resource.
repository:
  description: ""
  homepage: ""
  topics: []
  default_branch: main
  features:
    issues: true
    projects: true
    wiki: false
    discussions: true
  merge:
    allow_merge_commit: true
    allow_squash_merge: true
    allow_rebase_merge: true
    allow_auto_merge: false
    allow_update_branch: false
    delete_branch_on_merge: false
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
    squash_merge_commit_title: COMMIT_OR_PR_TITLE
    squash_merge_commit_message: COMMIT_MESSAGES
  web_commit_signoff_required: false
  security:
    private_vulnerability_reporting: false
    dependabot_alerts: false
    dependabot_security_updates: false
    secret_scanning: false
    secret_scanning_push_protection: false
labels:
- name: accessibility
  color: f143ab
  description: Barrier affecting people with disabilities
- name: bug
  color: d73a4a
  description: Something isn't working
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: invalid
  color: e4e669
  description: This doesn't seem right
- name: question
  color: d876e3
  description: Further information is requested
- name: wontfix
  color: ffffff
  description: This will not be worked on
rulesets:
# main requires signed commits, with two bypass actors (ADR 0034,
# GOVERNANCE.md):
#   RepositoryRole 5     the admin role, the maintainer's.
#   Integration 1236702  the Claude GitHub App, which pushes cloud AI
#                        sessions' commits; those cannot be signed, which
#                        ADR 0034 records as a stated deviation.
# A land/ fast-forward of `main` to an approved pull request's head is the
# maintainer's own push, under the admin bypass, so the head's unsigned agent
# commits pass this rule (ADR 0087 as amended 2026-10-08, ADR 0102). The gates
# App (5220446) is not here and needs no place: it pushes only v* tags, which
# this branch rule does not cover (the tag ruleset below bypasses it for that).
- name: Signed Commits
  target: branch
  enforcement: active
  conditions:
    ref_name:
      exclude: []
      include:
      - ~DEFAULT_BRANCH
  rules:
  - type: required_signatures
  bypass_actors:
  - actor_id: 5
    actor_type: RepositoryRole
    bypass_mode: always
  - actor_id: 1236702
    actor_type: Integration
    bypass_mode: always
# v* tags are created by the gates App, from a release descriptor landed at its
# approved head (ADR 0102, .github/workflows/release.yml). The maintainer's
# bypass stays to repair a tag; a tag made by hand publishes nothing, because
# publish.yml reads its notes from the version's descriptor and fails without.
- name: Varve Release Approval
  target: tag
  enforcement: active
  conditions:
    ref_name:
      exclude: []
      include:
      - refs/tags/v*
  rules:
  - type: deletion
  - type: non_fast_forward
  - type: creation
  bypass_actors:
  - actor_id: 2194785
    actor_type: User
    bypass_mode: always
  - actor_id: 5220446
    actor_type: Integration
    bypass_mode: always
# land/** is where a human pushes a commit so that it has its checks before main
# is fast-forwarded to it (ADR 0088), and the gates environment trusts it
# (ADR 0087): only the maintainer creates, moves or deletes one.
- name: land
  target: branch
  enforcement: active
  conditions:
    ref_name:
      exclude: []
      include:
      - refs/heads/land/**
  rules:
  - type: creation
  # Pushes to an existing land/ branch, the step before main is
  # fast-forwarded to its head. Declared with its parameter, as GitHub's
  # export writes it, so a whole-ruleset comparison does not read it as drift.
  - type: update
    parameters:
      update_allows_fetch_and_merge: false
  - type: deletion
  - type: non_fast_forward
  bypass_actors:
  - actor_id: 2194785
    actor_type: User
    bypass_mode: always
- name: trunk
  target: branch
  enforcement: active
  conditions:
    ref_name:
      exclude: []
      include:
      - ~DEFAULT_BRANCH
  rules:
  - type: deletion
  - type: non_fast_forward
  - type: required_status_checks
    parameters:
      strict_required_status_checks_policy: false
      do_not_enforce_on_create: false
      # Every gate, by its job name (ADR 0088). Not the durability jobs, which
      # measure and gate nothing, and not the decision report, which never
      # gates (ADR 0062). Renaming a job means renaming it here in the same
      # change, or nothing can land.
      required_status_checks:
      - context: pipeline (devcontainer)
      - context: release pending
      - context: dco
      - context: agent review
        # The gates App (ADR 0087): only its check run counts, so no job a
        # pull request adds under this name can satisfy it.
        integration_id: 5220446
      - context: build (ubuntu-latest)
      - context: build (windows-latest)
      - context: native aot (ubuntu-latest)
      - context: native aot (windows-latest)
      - context: repo-standard native and action (ubuntu-latest)
      - context: repo-standard native and action (windows-latest)
      - context: browser wasm
      - context: browser storage in Chromium
      - context: conformance (ubuntu-latest)
      - context: conformance (windows-latest)
      - context: auth (mock-oauth2)
      - context: auth (zitadel)
      - context: container (linux-x64)
      - context: container (linux-arm64)
  bypass_actors: []
environments:
# publish.yml's environment, named in nuget.org's trusted-publishing claim
# (ADR 0029). No reviewer since ADR 0102: the decision is the descriptor,
# approved on its pull request; a second approval here would be a human step
# after it. Only main and v* tags deploy to it.
- name: release
  wait_timer: 0
  prevent_self_review: false
  reviewers: []
  deployment_branch_policy:
    protected_branches: false
    custom_branch_policies: true
  branch_policies:
  - name: main
  - name: v*
    type: tag
  secrets:
  - NUGET_USER
# The Apps' keys (ADR 0087): the gates App, which posts the pinned check
# `agent review` and, since ADR 0102, creates v* tags and GitHub Releases
# (Contents: read & write), and the repo-standard App, which applies this
# file. Only main, land/** and v* tags can deploy to this environment, so no
# workflow a pull request defines can mint either token; a v* tag is created
# only by the gates App or the maintainer (ruleset above), and publish.yml's
# release job, on the tag, mints the token that creates the GitHub Release.
- name: gates
  wait_timer: 0
  prevent_self_review: false
  reviewers: []
  deployment_branch_policy:
    protected_branches: false
    custom_branch_policies: true
  branch_policies:
  - name: main
  - name: land/**
  - name: v*
    type: tag
  secrets:
  - GATES_APP_CLIENT_ID
  - GATES_APP_PRIVATE_KEY
  - REPO_STANDARD_APP_CLIENT_ID
  - REPO_STANDARD_APP_PRIVATE_KEY
# The real-provider auth legs (ADR 0100): Entra ID and Google credentials for
# test tenants, readable only by a job on main, so never by a pull request.
- name: auth-providers
  wait_timer: 0
  prevent_self_review: false
  reviewers: []
  deployment_branch_policy:
    protected_branches: false
    custom_branch_policies: true
  branch_policies:
  - name: main
  secrets:
  - VARVE_ENTRA_TENANT
  - VARVE_ENTRA_CLIENT_ID
  - VARVE_ENTRA_CLIENT_SECRET
  - VARVE_ENTRA_AUDIENCE
  - VARVE_GOOGLE_SERVICE_ACCOUNT
# The repository has no Actions secrets of its own: a repository secret is
# readable by any workflow a same-repository pull request defines. Both Apps'
# keys are in the gates environment above.
secrets: []
# projects: left out on purpose. The boards are owned by a user account, which an
# App's installation token cannot reach (ADR 0039); they are not managed here.
actions:
  enabled: true
  allowed_actions: all
  sha_pinning_required: false
  workflow:
    default_workflow_permissions: read
    can_approve_pull_request_reviews: false
