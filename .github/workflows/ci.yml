name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Gates merges. Everything here must be green.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not redundant. Parsers will meet CRLF and path
        # differences, and a repository that only ever builds on Linux
        # discovers that at the worst possible moment.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Dependency register
        # ADR 0009. Constraint 4 says every third-party package needs an ADR;
        # this is what makes that a gate rather than a sentence in a document.
        # A text check over two inputs, so it runs before restore and fails in
        # seconds rather than after a compile.
        run: dotnet run eng/dependency-register.cs

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Varve.slnx

      - name: Build
        # Warnings are errors by configuration, not by a flag here; see
        # Directory.Build.props. CI is set, so ContinuousIntegrationBuild is on
        # and the build is deterministic.
        run: dotnet build Varve.slnx --configuration Release --no-restore

      # Every test project except the conformance one, which has a job of its
      # own because it is gated by the ratchet rather than by its own result.
      # One step each rather than one step over the solution: `dotnet test`
      # takes a single --project, and a named step says which suite went red
      # without anyone opening the log.
      - name: Test the analyzers
        run: >
          dotnet test
          --project tests/Varve.Analyzers.Tests/Varve.Analyzers.Tests.csproj
          --configuration Release

      - name: Test Varve.Iri
        run: >
          dotnet test
          --project tests/Varve.Iri.Tests/Varve.Iri.Tests.csproj
          --configuration Release

      - name: Test Varve.Rdf
        run: >
          dotnet test
          --project tests/Varve.Rdf.Tests/Varve.Rdf.Tests.csproj
          --configuration Release

      - name: Test Varve.Turtle
        run: >
          dotnet test
          --project tests/Varve.Turtle.Tests/Varve.Turtle.Tests.csproj
          --configuration Release

  # Constraint 2, proven rather than configured. An analyzer only sees what it
  # can see statically; only an ILC run shows the packages publish, and only
  # running the binary shows the interesting AOT failures — a trimmed type, a
  # missing instantiation — which are at run time and silent.
  aot:
    name: native aot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        # IlcTreatWarningsAsErrors is set in the project, so an ILC warning
        # fails here rather than being printed.
        run: >
          dotnet publish tests/Varve.AotSmoke
          --configuration Release
          --output ${{ github.workspace }}/artifacts/aot

      - name: Run
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            "${{ github.workspace }}/artifacts/aot/Varve.AotSmoke.exe"
          else
            "${{ github.workspace }}/artifacts/aot/Varve.AotSmoke"
          fi

  # Constraint 3. CI publishes the browser build and requires it to be
  # warning-free; it does not run it, because running it needs a browser and a
  # server. The run happens where the browser is, and ADR 0020 records the
  # result of the one that mattered.
  wasm:
    name: browser wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install the WebAssembly workloads
        run: dotnet workload install wasm-tools wasm-experimental

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-wasm-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-wasm-

      - name: Build
        run: dotnet build tests/Varve.WasmSmoke --configuration Release

      - name: Upload the app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-app-bundle
          path: tests/Varve.WasmSmoke/bin/Release/net10.0/browser-wasm/AppBundle
          if-no-files-found: error

  # Does not gate on the raw test result, and still should not now that all 157
  # cases pass: an exempt case is allowed to fail, and a case outside the
  # baseline is allowed to fail while it is being worked on (ADR 0007). The
  # ratchet gates instead — on a regression, on a case that vanished, on an
  # exemption with no justification, and on the harness itself failing.
  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run the W3C suites
        continue-on-error: true
        run: >
          dotnet test
          --project tests/Varve.Conformance.Tests/Varve.Conformance.Tests.csproj
          --configuration Release
          --report-trx
          --results-directory ${{ github.workspace }}/artifacts/conformance

      - name: Ratchet
        # This is the gate. It also writes the per-suite pass and fail counts to
        # the step summary, so that the number rather than the colour is what
        # people read on a job that is expected to be red for months.
        run: >
          dotnet run eng/ratchet.cs --
          ${{ github.workspace }}/artifacts/conformance
          --label ${{ matrix.os }}

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-trx-${{ matrix.os }}
          path: ${{ github.workspace }}/artifacts/conformance
          if-no-files-found: warn
