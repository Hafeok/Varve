# Publishes to nuget.org on a v* tag, through trusted publishing.
#
# The policy on nuget.org names this file by path — decision-driven-design /
# Hafeok/Varve / publish.yml — so renaming it breaks publishing in a way that
# looks like an authentication failure. It names the workflow file and the
# environment, never a job, so the push can be a job of its own. See ADR 0029.
#
# A version pushed to nuget.org cannot be edited, replaced or deleted, only
# unlisted. That is why every gate runs here too: a tag is the one moment they
# matter most, and it is the wrong place to save four minutes.
#
# The dry run (ADR 0224, amended 2026-10-28). On a pull request that touches
# the release pipeline, and on a dispatch, every job runs at the head:
#   - the gates;
#   - the SBOMs, checked against the pending descriptor;
#   - the pack;
#   - every attestation, provenance and SBOM, per package and for the image;
#   - the release's assets;
#   - the verification, against what this run built.
# Four things are skipped: the push to nuget.org (`push`), the push to GHCR
# and the multi-platform manifest that needs it (each platform's image is
# built and attested by its manifest's digest instead), and the GitHub release
# (`release`). So the first tag is not the first time any of this runs.

name: Publish

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - eng/sbom.cs
      - eng/nuget-served.cs
      - eng/package-metadata.cs
      - eng/release.cs
      - eng/lib/**
      - releases/**
      - Directory.Build.targets
      - src/Varve.Server/container/**
  workflow_dispatch:

permissions:
  contents: read

# A dry run of a pull request is superseded by its next push; a tag's run is
# never cancelled.
concurrency:
  group: publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  publish:
    runs-on: ubuntu-latest

    # A pull request from a fork gets no OIDC token, so its dry run could not
    # attest anything; it is not run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}

    permissions:
      contents: read

      # The attestations are keyless, signed through this job's OIDC identity
      # (ADR 0224 point 3). The push, and the trusted-publishing token it
      # needs, are the push job's.
      id-token: write
      attestations: write

    steps:
      - name: Line endings
        # Before the checkout, because this is what the checkout obeys. Windows
        # runners default to core.autocrlf=true, which rewrote the W3C suite's
        # line endings at milestone 3b and left the two platforms testing
        # different bytes — 163 cases reported a line number that was wrong on
        # one runner only. Conformance inputs must be identical everywhere;
        # CR LF handling is tested on documents this repository owns. ADR 0036.
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A dry run builds the pull request's head, not GitHub's merge of it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

          # MinVer reads the version off the tag, and a shallow clone has no
          # tags. A package versioned 0.0.0-alpha.0.N on a tagged build is this
          # line having been dropped.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install the WebAssembly workloads
        run: dotnet workload install wasm-tools wasm-experimental

      - name: Dependency register
        # ADR 0224: the register against every lockfile, the Action pins and
        # the VEX statements. Text only; the restore's half follows it.
        run: dotnet run eng/dependency-register.cs

      - name: Decision sets
        # ADR 0062. Reads the git history, which the full fetch above provides.
        run: dotnet run eng/decision-sets.cs

      - name: Banned symbols
        # ADR 0063.
        run: dotnet run eng/banned-symbols.cs

      - name: Licence headers
        # MPL-2.0 is file-level copyleft: a file is Covered Software because it
        # carries the Exhibit A notice (ADR 0031). A package published with a
        # file missing its notice cannot be corrected afterwards, only
        # unlisted, so this runs here as well as on every pull request.
        run: dotnet run eng/licence-headers.cs

      - name: Restore
        # Locked (CI is set, ADR 0224): a lockfile that does not match the
        # register fails here, before anything is built.
        run: dotnet restore Varve.slnx

      - name: Plan
        # What is released, after the restore (MinVer's version needs MinVer
        # restored) and before the build. At a tag, the tag's version and descriptor. In a
        # dry run, the one pending descriptor (no tag yet), as its landing
        # would cut it; with none pending, the version MinVer gives the head,
        # created at its time, with no descriptor to check. MinVerVersionOverride
        # makes every build and pack of this job, and the image's, that
        # version, so the packages and the SBOMs they embed agree with the
        # descriptor.
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
            for descriptor in releases/v*.yaml; do
              candidate=$(basename "$descriptor" .yaml)
              if ! git rev-parse -q --verify "refs/tags/$candidate" > /dev/null; then tag="$candidate"; fi
            done
          fi
          if [ -n "$tag" ]; then
            version="${tag#v}"
            descriptor="releases/$tag.yaml"
            created=$(sed -n 's/^date: *//p' "$descriptor")
          else
            version=$(dotnet msbuild src/Varve.Iri/Varve.Iri.csproj -t:MinVer -getProperty:MinVerVersion | tr -d '\r')
            descriptor=""
            created=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)
            tag="v$version"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "descriptor=$descriptor"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"
          echo "MinVerVersionOverride=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then kind="Release"; else kind="Dry run"; fi
          {
            echo "### $kind plan"
            echo "Version \`$version\`, descriptor \`${descriptor:-none}\`, created \`$created\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Licences and native assets
        # ADR 0224 point 4, and constraint 1 on the shipped closure (what
        # eng/native-assets.cs was).
        run: dotnet run eng/dependency-register.cs -- --packages

      - name: Build
        run: dotnet build Varve.slnx --configuration Release --no-restore

      - name: Test the analyzers
        run: dotnet test --project tests/Varve.Analyzers.Tests/Varve.Analyzers.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Analyzers.Tests

      - name: Test Varve.Iri
        run: dotnet test --project tests/Varve.Iri.Tests/Varve.Iri.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Iri.Tests

      - name: Test Varve.Rdf
        run: dotnet test --project tests/Varve.Rdf.Tests/Varve.Rdf.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Rdf.Tests

      - name: Test Varve.Turtle
        run: dotnet test --project tests/Varve.Turtle.Tests/Varve.Turtle.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Turtle.Tests

      - name: Test Varve.RdfXml
        run: dotnet test --project tests/Varve.RdfXml.Tests/Varve.RdfXml.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.RdfXml.Tests

      - name: Test Varve.JsonLd
        run: dotnet test --project tests/Varve.JsonLd.Tests/Varve.JsonLd.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.JsonLd.Tests

      - name: Test Varve.Delta
        run: dotnet test --project tests/Varve.Delta.Tests/Varve.Delta.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Delta.Tests

      - name: Test Varve.Store
        # #126: the build job's Ubuntu limit and hang dump, for the same suite.
        timeout-minutes: 12
        run: dotnet test --project tests/Varve.Store.Tests/Varve.Store.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Store.Tests --hangdump --hangdump-timeout 10m

      - name: Test Varve.Xsd
        run: dotnet test --project tests/Varve.Xsd.Tests/Varve.Xsd.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Xsd.Tests

      - name: Test Varve.Sparql
        run: dotnet test --project tests/Varve.Sparql.Tests/Varve.Sparql.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Sparql.Tests

      - name: Test Varve.Sparql.Results
        run: dotnet test --project tests/Varve.Sparql.Results.Tests/Varve.Sparql.Results.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Sparql.Results.Tests

      - name: Test Varve.Sparql.Evaluation
        run: dotnet test --project tests/Varve.Sparql.Evaluation.Tests/Varve.Sparql.Evaluation.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Sparql.Evaluation.Tests

      - name: Test Varve.Sparql.Store
        run: dotnet test --project tests/Varve.Sparql.Store.Tests/Varve.Sparql.Store.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Sparql.Store.Tests

      - name: Test Varve.Derivation
        run: dotnet test --project tests/Varve.Derivation.Tests/Varve.Derivation.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Derivation.Tests

      - name: Test Varve.Shacl
        run: dotnet test --project tests/Varve.Shacl.Tests/Varve.Shacl.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Shacl.Tests

      - name: Test Varve.Shacl.Sparql
        run: dotnet test --project tests/Varve.Shacl.Sparql.Tests/Varve.Shacl.Sparql.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Shacl.Sparql.Tests

      - name: Test Varve.Shacl.Store
        run: dotnet test --project tests/Varve.Shacl.Store.Tests/Varve.Shacl.Store.Tests.csproj --configuration Release --report-trx --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Shacl.Store.Tests

      - name: Run the W3C suites
        continue-on-error: true
        run: >
          dotnet test
          --project tests/Varve.Conformance.Tests/Varve.Conformance.Tests.csproj
          --configuration Release
          --report-trx
          --results-directory ${{ github.workspace }}/artifacts/conformance

      - name: Ratchet
        run: dotnet run eng/ratchet.cs -- ${{ github.workspace }}/artifacts/conformance --label publish

      - name: Native AOT
        run: |
          dotnet publish tests/Varve.AotSmoke --configuration Release \
            --output ${{ github.workspace }}/artifacts/aot
          "${{ github.workspace }}/artifacts/aot/Varve.AotSmoke"

      - name: Browser WASM
        run: dotnet build tests/Varve.WasmSmoke --configuration Release

      # Varve.Store.Browser is one of the packages this pushes, and these are
      # its only tests (ADR 0084). Same steps and browser as ci.yml's
      # browser-tests job.
      - name: Build the browser storage test app
        run: dotnet build tests/Varve.Store.BrowserTests --configuration Release

      - name: Browser storage in headless Chromium
        env:
          VARVE_CHROME: ${{ vars.VARVE_CHROME || '/usr/bin/google-chrome' }}
        run: dotnet run eng/browser-tests.cs

      - name: Changelog
        # ADR 0102: CHANGELOG.md is the projection of releases/, the tagged
        # version's descriptor folded in.
        run: dotnet run eng/changelog.cs -- --check

      - name: Release notes
        # The tag's descriptor, releases/<version>.yaml: its summary is the
        # GitHub Release's notes and "<version> — <title>" its title. Read here,
        # before anything is pushed, so a tag with no descriptor fails while
        # nothing is permanent; the release job below publishes them once the
        # push has succeeded.
        if: steps.plan.outputs.descriptor != ''
        run: dotnet run eng/release.cs -- --notes "${{ steps.plan.outputs.tag }}" --into "${{ github.workspace }}/artifacts/release"

      - name: Install Syft
        # The image's OS packages are Syft's, from the base image pinned by
        # digest (ADR 0225 point 5). Its version is pinned, because the SBOM's
        # digest is in the descriptor and must come out the same here.
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.0

      - name: SBOMs
        # ADR 0224 points 1 to 3, ADR 0225: one SBOM per artefact, from this
        # restore, created at the descriptor's date. Each digest must be the
        # descriptor's (ADR 0102, amended 2026-10-27), checked here while
        # nothing is permanent.
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CREATED: ${{ steps.plan.outputs.created }}
          DESCRIPTOR: ${{ steps.plan.outputs.descriptor }}
        run: |
          set -euo pipefail
          check=()
          if [ -n "$DESCRIPTOR" ]; then check=(--descriptor "$DESCRIPTOR"); fi
          dotnet run eng/sbom.cs -- --version "$VERSION" --created "$CREATED" \
            --out "${{ github.workspace }}/artifacts/sbom" \
            --syft "${{ steps.syft.outputs.cmd }}" \
            "${check[@]}"

      - name: Pack
        # Each package embeds its SBOM (ADR 0224 point 3).
        run: >
          dotnet pack Varve.slnx
          --configuration Release
          --no-build
          -p:ContinuousIntegrationBuild=true
          -p:VarveSbomDirectory=${{ github.workspace }}/artifacts/sbom
          --output ${{ github.workspace }}/artifacts/packages

      - name: Check the package metadata
        run: dotnet run eng/package-metadata.cs -- ${{ github.workspace }}/artifacts/packages

      - name: Check the package version against the tag
        # MinVer takes the version from the tag, but only from a tag it
        # recognises: a missing MinVerTagPrefix or a shallow clone both pack
        # 0.0.0-alpha.0.N without failing anything. A version cannot be
        # replaced once pushed, so the file names are checked here.
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          version="$VERSION"
          status=0
          for package in "${{ github.workspace }}"/artifacts/packages/*.nupkg; do
            case "$(basename "$package")" in
              *."$version".nupkg) echo "ok  $(basename "$package")" ;;
              *) echo "::error::$(basename "$package") is not version $version"; status=1 ;;
            esac
          done
          exit $status

      - name: Checksums
        # Every file the release carries beyond its SBOMs, with its SHA-256;
        # attested below with the packages, so the list is as verifiable as
        # what it lists (ADR 0224 point 7).
        working-directory: ${{ github.workspace }}/artifacts/packages
        run: sha256sum *.nupkg > SHA256SUMS && cat SHA256SUMS

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: ${{ github.workspace }}/artifacts/packages
          if-no-files-found: error

      - name: Upload the SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: ${{ github.workspace }}/artifacts/sbom
          if-no-files-found: error

      - name: The packages' SBOM matrix
        # One SBOM attestation per package, so one job each (actions/attest
        # takes one SBOM per call): the list, for the attest job.
        id: matrix
        shell: bash
        working-directory: ${{ github.workspace }}/artifacts/packages
        run: |
          echo "packages=$(ls *.nupkg | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

      - name: Attest the packages' build provenance
        # Keyless, through this job's OIDC identity (ADR 0224 point 3): every
        # package and the checksum list, one SLSA v1 statement. The SBOM
        # attestations are the attest-packages job's, one job per package; the
        # push waits for both.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/artifacts/packages/*.nupkg
            ${{ github.workspace }}/artifacts/packages/SHA256SUMS

      - name: Upload the test results
        # #126: every run keeps its TRX, pass or fail, so a slow or red run
        # can be explained test by test from its own artifacts.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-publish
          path: ${{ github.workspace }}/artifacts/test-results
          if-no-files-found: warn

  # One SBOM attestation per package (ADR 0224 point 3): the SBOM the package
  # embeds, on the package's digest.
  attest-packages:
    name: attest the packages' SBOMs
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.publish.outputs.packages) }}

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: The package's own SBOM
        # The document embedded in the package is the one attested, so the
        # two cannot differ.
        run: unzip -p "$RUNNER_TEMP/packages/${{ matrix.package }}" _manifest/spdx_2.3/manifest.spdx.json > "$RUNNER_TEMP/sbom.spdx.json"

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/packages/${{ matrix.package }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json

  # The push to nuget.org, at a tag only, after every package has both its
  # attestations (ADR 0224 point 3): no package reaches nuget.org unattested.
  #
  # Why a job of its own, not a step after the attestations in the publish job:
  # - actions/attest takes one SBOM per call, and the packages are a list the
  #   pack produces (27 today). A job's steps are fixed when the workflow is
  #   read and cannot loop over an action, so the SBOM attestations are a
  #   matrix, which is jobs, and a step cannot wait for them.
  # - Writing one literal step per package would be a second list of the
  #   packages, beside Varve.slnx, which drifts the first time a package is
  #   added.
  # - Trusted publishing names this workflow file and the `release`
  #   environment, never a job (ADR 0029), so the push is as trusted here as
  #   it was in the publish job.
  #
  # ADR 0102. The human decision is the release descriptor, reviewed and
  # approved on its pull request and landed at its approved head; the tag that
  # started this run was created from it by the gates App, after every gate
  # passed at that commit. The `release` environment keeps its branch and tag
  # restriction (main and v*) and has no reviewer: a second approval here would
  # be a human step after the decision, which is what ADR 0102 removes.
  push:
    name: push to nuget.org
    needs: [publish, attest-packages]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read

      # Trusted publishing: the workflow's OIDC token is exchanged for a
      # short-lived API key. There is no long-lived secret to leak or rotate.
      id-token: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: The attested bytes
        # The packages pushed are the ones attested, checked against the
        # attested checksum list before a credential is minted.
        working-directory: ${{ runner.temp }}/packages
        run: sha256sum --check SHA256SUMS

      # The two steps below are adjacent on purpose. The key NuGet/login mints
      # lives one hour, and anything between them is something that can fail
      # while a credential is in flight.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        # --skip-duplicate so that re-running a half-successful publish does not
        # fail on the packages that already went up. A tag that published two of
        # three packages and cannot be retried is the failure to avoid.
        run: >
          dotnet nuget push "${{ runner.temp }}/packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # The container image (ADR 0111), after the gates: the Native AOT binary
  # published on a native runner per architecture, built into the chiseled
  # image and pushed by digest; the manifest job joins the two, tags the
  # release's version (and latest for a version with no prerelease part),
  # attests build provenance and an SPDX SBOM for the manifest's digest, and
  # verifies both as an operator would.
  image:
    name: image (${{ matrix.rid }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            platform: linux/amd64
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/hafeok/varve
      # The release's version, so the binary in the image says what the
      # packages say, in a dry run as at a tag.
      MinVerVersionOverride: ${{ needs.publish.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Publish the server
        run: >
          dotnet publish src/Varve.Server
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output ${{ github.workspace }}/artifacts/server-aot

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push by digest
        # At a tag, pushed to GHCR by digest. In a dry run, written as an OCI
        # layout and pushed nowhere: its manifest is a file whose SHA-256 is
        # the image's digest, which is what the manifest job attests.
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}/artifacts/server-aot
          file: src/Varve.Server/container/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || format('type=oci,dest={0}/oci,tar=false', runner.temp) }}

      - name: Keep the digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            touch "$RUNNER_TEMP/digests/${digest#sha256:}"
          else
            # The manifest itself, named by its digest, checked to be that digest.
            cp "$RUNNER_TEMP/oci/blobs/sha256/${digest#sha256:}" "$RUNNER_TEMP/digests/${digest#sha256:}"
            echo "${digest#sha256:}  $RUNNER_TEMP/digests/${digest#sha256:}" | sha256sum --check
          fi

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ matrix.rid }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: image manifest, attested
    needs: [publish, image]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      IMAGE: ghcr.io/hafeok/varve

    steps:
      - name: Download the digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest
        # The tag is the release descriptor's version (ADR 0102); latest only
        # for a version with no prerelease part (ADR 0111 point 6).
        if: github.event_name == 'push'
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(--tag "$IMAGE:$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags+=(--tag "$IMAGE:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$GITHUB_REF_NAME\` is \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"

      - name: Attest the build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Download the SBOMs
        # The image's SBOM was written in the publish job (ADR 0225 point 5):
        # each platform's binary and its closure, from the restore, and the
        # base image's OS packages, from the base pinned by digest. Its digest
        # is the descriptor's.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      - name: Attest the SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/image/varve.spdx.json
          push-to-registry: true

      # The dry run: no registry, so no multi-platform manifest. Each
      # platform's image manifest, a file whose SHA-256 is that image's digest,
      # is attested instead, with the same two predicates, and verified by
      # that digest as an operator verifies the image.
      - name: Attest each platform's build provenance (dry run)
        if: github.event_name != 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/digests/*

      - name: Attest each platform's SBOM (dry run)
        if: github.event_name != 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/digests/*
          sbom-path: ${{ runner.temp }}/sbom/image/varve.spdx.json

      - name: Verify each platform's image (dry run)
        if: github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The commit the attestation's signing identity records: the run's,
          # which for a pull request is GitHub's merge of it, though the build
          # checked out the head.
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for manifest in "$RUNNER_TEMP"/digests/*; do
            for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
              gh attestation verify "$manifest" --owner hafeok --source-digest "$RUN_SHA" --predicate-type "$predicate" --format json \
                --jq '.[].verificationResult | "verified \(.statement.predicateType) for the image sha256:\(.statement.subject[0].digest.sha256), signed by \(.signature.certificate.buildSignerURI) at \(.signature.certificate.sourceRepositoryDigest)"' \
                | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: Verify, as an operator would
        # pipefail, or the step's status is tee's and a failed verification
        # passes. gh prints nothing on success off a terminal, so each
        # verified statement is printed from its JSON: what, by whom, from
        # which commit.
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT: oci://${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            gh attestation verify "$SUBJECT" --owner hafeok --source-ref "refs/tags/$GITHUB_REF_NAME" --predicate-type "$predicate" --format json \
              --jq '.[].verificationResult | "verified \(.statement.predicateType) for \(.statement.subject[0].name)@sha256:\(.statement.subject[0].digest.sha256), signed by \(.signature.certificate.buildSignerURI) at \(.signature.certificate.sourceRepositoryDigest)"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # The release's assets (ADR 0224 points 3 and 6): every SBOM, the VEX
  # document, the packages exactly as they were attested (nuget.org adds its
  # repository signature, so its copies are not these bytes), and their
  # checksums, each SBOM named for its artefact and version. A job of its own,
  # with no environment and no credential, so the dry run assembles exactly
  # what the release will carry.
  release-assets:
    name: the release's assets
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      - name: Download the SBOMs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      - name: The release's assets
        shell: bash
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          cp "$RUNNER_TEMP"/packages/*.nupkg "$RUNNER_TEMP/packages/SHA256SUMS" "$assets/"
          for sbom in "$RUNNER_TEMP"/sbom/nupkg/*.spdx.json "$RUNNER_TEMP"/sbom/tool/*.spdx.json; do
            name=$(basename "$sbom" .spdx.json)
            cp "$sbom" "$assets/$name.$version.spdx.json"
          done
          cp "$RUNNER_TEMP/sbom/image/varve.spdx.json" "$assets/varve-image-$version.spdx.json"
          cp security/vex.openvex.json "$assets/varve-$version.openvex.json"
          (cd "$assets" && sha256sum --check SHA256SUMS)
          ls -l "$assets" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the release's assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
          if-no-files-found: error

  # The GitHub release for the tag, with its descriptor's summary as the notes
  # and the assets above. At a tag only. A separate job so that contents: write
  # is never held by the job that runs the build and the tests, and after the
  # push, so that a release is never created for a version that did not reach
  # nuget.org. Re-runnable on its own. Created by the gates App, never by
  # GITHUB_TOKEN (ADR 0102): the App made the tag, and the identity map says the
  # maintainer decides, the App executes (ADR 0087). The gates environment
  # admits v* tags for this job.
  release:
    needs: [push, release-assets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: gates

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The previous tag, for the notes' compare link.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Release notes
        run: dotnet run eng/release.cs -- --notes "$GITHUB_REF_NAME" --into "$RUNNER_TEMP/release"

      - name: Download the release's assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets

      - name: Mint the gates App's token
        id: gates
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATES_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gates.outputs.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [ "$(cat "$RUNNER_TEMP/release/prerelease.txt")" = "true" ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$(cat "$RUNNER_TEMP/release/title.txt")" \
            --notes-file "$RUNNER_TEMP/release/notes.md" \
            "${prerelease[@]}" \
            "$RUNNER_TEMP"/assets/*

  # ADR 0224's consequence: what was published is verified as a consumer
  # would verify it, after the release.
  #
  # - Each package attached to the release, which is the attested package
  #   byte for byte, is verified with gh attestation verify for both
  #   predicates. Each embedded SBOM must be the release's SBOM asset.
  # - nuget.org's copy cannot be: nuget.org adds its repository signature, an
  #   entry of its own, so its bytes are not the attested ones. It is
  #   downloaded instead, and every entry but .signature.p7s is required to be
  #   the attested package's, byte for byte. Its repository signature is then
  #   verified with `dotnet nuget verify`.
  # - The image is verified by the manifest job, as before.
  #
  # In a dry run the same checks run against what this run built (the
  # release-assets artifact), with --source-digest the run's commit, and the nuget.org
  # step, which needs the push, is skipped.
  verify:
    name: verify what was published
    needs: [publish, release-assets, attest-packages, manifest, release]
    if: >-
      !cancelled()
      && needs.release-assets.result == 'success'
      && needs.attest-packages.result == 'success'
      && needs.manifest.result == 'success'
      && (needs.release.result == 'success' || (github.event_name != 'push' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      VERSION: ${{ needs.publish.outputs.version }}
      # The commit the attestations' signing identity records (see the
      # manifest job).
      RUN_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Download the release's assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"

      - name: Download what this run built (dry run)
        if: github.event_name != 'push'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: ${{ runner.temp }}/release

      - name: Verify the release's packages and their SBOMs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          version="$VERSION"
          # At a tag, the attestation must come from the tag's run; in a dry
          # run, from the head this run built. A dry run's attestations never
          # satisfy a release's verification.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then source=(--source-ref "refs/tags/$GITHUB_REF_NAME"); else source=(--source-digest "$RUN_SHA"); fi
          for package in *.nupkg; do
            for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
              gh attestation verify "$package" --owner hafeok "${source[@]}" --predicate-type "$predicate" --format json \
                --jq '.[].verificationResult | "verified \(.statement.predicateType) for \(.statement.subject[0].name)@sha256:\(.statement.subject[0].digest.sha256), signed by \(.signature.certificate.buildSignerURI) at \(.signature.certificate.sourceRepositoryDigest)"' \
                | tee -a "$GITHUB_STEP_SUMMARY"
            done
            id="${package%."$version".nupkg}"
            unzip -p "$package" _manifest/spdx_2.3/manifest.spdx.json | cmp - "$id.$version.spdx.json"
          done

      - name: nuget.org serves the attested packages
        # nuget.org indexes a new version within minutes, sometimes longer:
        # each package is retried for up to 30 minutes. At a tag only: a dry
        # run pushed nothing.
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          version="$VERSION"
          mkdir -p nuget
          for package in *.nupkg; do
            id="${package%."$version".nupkg}"
            lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
            url="https://api.nuget.org/v3-flatcontainer/$lower/$version/$lower.$version.nupkg"
            for attempt in $(seq 1 60); do
              if curl -fsSL -o "nuget/$package" "$url"; then break; fi
              if [ "$attempt" -eq 60 ]; then echo "::error::$url is not served after 30 minutes"; exit 1; fi
              sleep 30
            done
            dotnet run "$GITHUB_WORKSPACE/eng/nuget-served.cs" -- "$package" "nuget/$package" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          dotnet nuget verify --all nuget/*.nupkg
