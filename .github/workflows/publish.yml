# Publishes to nuget.org on a v* tag, through trusted publishing.
#
# The policy on nuget.org names this file by path — decision-driven-design /
# Hafeok/Varve / publish.yml, no environment — so renaming it breaks publishing
# in a way that looks like an authentication failure. See ADR 0029.
#
# A version pushed to nuget.org cannot be edited, replaced or deleted, only
# unlisted. That is why every gate runs here too: a tag is the one moment they
# matter most, and it is the wrong place to save four minutes.

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  publish:
    runs-on: ubuntu-latest

    # The one place a human is required. ADR 0032 moved review off the path to
    # the trunk and onto this: the `release` environment has the maintainer as
    # a required reviewer, so a tag does not publish until a person approves it.
    # Merging is gated by the checks; publishing is gated by a person, because
    # a version pushed to nuget.org cannot be edited, replaced or deleted.
    #
    # MAINTAINER, BEFORE THE FIRST v* TAG: the trusted-publishing policy on
    # nuget.org was created naming this workflow with *no* environment (ADR
    # 0029). Adding the environment changes the OIDC claim the policy is
    # matched against, so the policy has to be updated to name `release` or the
    # push step fails authentication in a way that looks like a bad credential.
    # Nothing is published yet, so nothing is broken today.
    environment: release

    permissions:
      contents: read

      # Trusted publishing: the workflow's OIDC token is exchanged for a
      # short-lived API key. There is no long-lived secret to leak or rotate.
      id-token: write

    steps:
      - name: Line endings
        # Before the checkout, because this is what the checkout obeys. Windows
        # runners default to core.autocrlf=true, which rewrote the W3C suite's
        # line endings at milestone 3b and left the two platforms testing
        # different bytes — 163 cases reported a line number that was wrong on
        # one runner only. Conformance inputs must be identical everywhere;
        # CR LF handling is tested on documents this repository owns. ADR 0036.
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

          # MinVer reads the version off the tag, and a shallow clone has no
          # tags. A package versioned 0.0.0-alpha.0.N on a tagged build is this
          # line having been dropped.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install the WebAssembly workloads
        run: dotnet workload install wasm-tools wasm-experimental

      - name: Dependency register
        run: dotnet run eng/dependency-register.cs

      - name: Licence headers
        # MPL-2.0 is file-level copyleft: a file is Covered Software because it
        # carries the Exhibit A notice (ADR 0031). A package published with a
        # file missing its notice cannot be corrected afterwards, only
        # unlisted, so this runs here as well as on every pull request.
        run: dotnet run eng/licence-headers.cs

      - name: Restore
        run: dotnet restore Varve.slnx

      - name: Native assets
        run: dotnet run eng/native-assets.cs

      - name: Build
        run: dotnet build Varve.slnx --configuration Release --no-restore

      - name: Test the analyzers
        run: dotnet test --project tests/Varve.Analyzers.Tests/Varve.Analyzers.Tests.csproj --configuration Release

      - name: Test Varve.Iri
        run: dotnet test --project tests/Varve.Iri.Tests/Varve.Iri.Tests.csproj --configuration Release

      - name: Test Varve.Rdf
        run: dotnet test --project tests/Varve.Rdf.Tests/Varve.Rdf.Tests.csproj --configuration Release

      - name: Test Varve.Turtle
        run: dotnet test --project tests/Varve.Turtle.Tests/Varve.Turtle.Tests.csproj --configuration Release

      - name: Test Varve.Store
        run: dotnet test --project tests/Varve.Store.Tests/Varve.Store.Tests.csproj --configuration Release

      - name: Test Varve.Xsd
        run: dotnet test --project tests/Varve.Xsd.Tests/Varve.Xsd.Tests.csproj --configuration Release

      - name: Test Varve.Sparql
        run: dotnet test --project tests/Varve.Sparql.Tests/Varve.Sparql.Tests.csproj --configuration Release

      - name: Test Varve.Sparql.Results
        run: dotnet test --project tests/Varve.Sparql.Results.Tests/Varve.Sparql.Results.Tests.csproj --configuration Release

      - name: Test Varve.Sparql.Evaluation
        run: dotnet test --project tests/Varve.Sparql.Evaluation.Tests/Varve.Sparql.Evaluation.Tests.csproj --configuration Release

      - name: Test Varve.Sparql.Store
        run: dotnet test --project tests/Varve.Sparql.Store.Tests/Varve.Sparql.Store.Tests.csproj --configuration Release

      - name: Run the W3C suites
        continue-on-error: true
        run: >
          dotnet test
          --project tests/Varve.Conformance.Tests/Varve.Conformance.Tests.csproj
          --configuration Release
          --report-trx
          --results-directory ${{ github.workspace }}/artifacts/conformance

      - name: Ratchet
        run: dotnet run eng/ratchet.cs -- ${{ github.workspace }}/artifacts/conformance --label publish

      - name: Native AOT
        run: |
          dotnet publish tests/Varve.AotSmoke --configuration Release \
            --output ${{ github.workspace }}/artifacts/aot
          "${{ github.workspace }}/artifacts/aot/Varve.AotSmoke"

      - name: Browser WASM
        run: dotnet build tests/Varve.WasmSmoke --configuration Release

      - name: Pack
        run: >
          dotnet pack Varve.slnx
          --configuration Release
          --no-build
          -p:ContinuousIntegrationBuild=true
          --output ${{ github.workspace }}/artifacts/packages

      - name: Check the package metadata
        run: dotnet run eng/package-metadata.cs -- ${{ github.workspace }}/artifacts/packages

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: ${{ github.workspace }}/artifacts/packages
          if-no-files-found: error

      # The two steps below are adjacent on purpose. The key NuGet/login mints
      # lives one hour, and anything between them is something that can fail
      # while a credential is in flight.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        # --skip-duplicate so that re-running a half-successful publish does not
        # fail on the packages that already went up. A tag that published two of
        # three packages and cannot be retried is the failure to avoid.
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
