# Publishes to nuget.org on a v* tag, through trusted publishing.
#
# The policy on nuget.org names this file by path — decision-driven-design /
# Hafeok/Varve / publish.yml, no environment — so renaming it breaks publishing
# in a way that looks like an authentication failure. See ADR 0029.
#
# A version pushed to nuget.org cannot be edited, replaced or deleted, only
# unlisted. That is why every gate runs here too: a tag is the one moment they
# matter most, and it is the wrong place to save four minutes.

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  publish:
    runs-on: ubuntu-latest

    # ADR 0102. The human decision is the release descriptor, reviewed and
    # approved on its pull request and landed at its approved head; the tag
    # that started this run was created from it by the gates App, after every
    # gate passed at that commit. The `release` environment keeps its branch
    # and tag restriction (main and v*) and has no reviewer: a second approval
    # here would be a human step after the decision, which is what ADR 0102
    # removes. The environment's name stays in the OIDC claim, so the
    # trusted-publishing policy on nuget.org is unchanged (ADR 0029).
    environment: release

    permissions:
      contents: read

      # Trusted publishing: the workflow's OIDC token is exchanged for a
      # short-lived API key. There is no long-lived secret to leak or rotate.
      id-token: write

    steps:
      - name: Line endings
        # Before the checkout, because this is what the checkout obeys. Windows
        # runners default to core.autocrlf=true, which rewrote the W3C suite's
        # line endings at milestone 3b and left the two platforms testing
        # different bytes — 163 cases reported a line number that was wrong on
        # one runner only. Conformance inputs must be identical everywhere;
        # CR LF handling is tested on documents this repository owns. ADR 0036.
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

          # MinVer reads the version off the tag, and a shallow clone has no
          # tags. A package versioned 0.0.0-alpha.0.N on a tagged build is this
          # line having been dropped.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install the WebAssembly workloads
        run: dotnet workload install wasm-tools wasm-experimental

      - name: Dependency register
        run: dotnet run eng/dependency-register.cs

      - name: Decision sets
        # ADR 0062. Reads the git history, which the full fetch above provides.
        run: dotnet run eng/decision-sets.cs

      - name: Banned symbols
        # ADR 0063.
        run: dotnet run eng/banned-symbols.cs

      - name: Licence headers
        # MPL-2.0 is file-level copyleft: a file is Covered Software because it
        # carries the Exhibit A notice (ADR 0031). A package published with a
        # file missing its notice cannot be corrected afterwards, only
        # unlisted, so this runs here as well as on every pull request.
        run: dotnet run eng/licence-headers.cs

      - name: Restore
        run: dotnet restore Varve.slnx

      - name: Native assets
        run: dotnet run eng/native-assets.cs

      - name: Build
        run: dotnet build Varve.slnx --configuration Release --no-restore

      - name: Test the analyzers
        run: dotnet test --project tests/Varve.Analyzers.Tests/Varve.Analyzers.Tests.csproj --configuration Release

      - name: Test Varve.Iri
        run: dotnet test --project tests/Varve.Iri.Tests/Varve.Iri.Tests.csproj --configuration Release

      - name: Test Varve.Rdf
        run: dotnet test --project tests/Varve.Rdf.Tests/Varve.Rdf.Tests.csproj --configuration Release

      - name: Test Varve.Turtle
        run: dotnet test --project tests/Varve.Turtle.Tests/Varve.Turtle.Tests.csproj --configuration Release

      - name: Test Varve.Store
        run: dotnet test --project tests/Varve.Store.Tests/Varve.Store.Tests.csproj --configuration Release

      - name: Test Varve.Xsd
        run: dotnet test --project tests/Varve.Xsd.Tests/Varve.Xsd.Tests.csproj --configuration Release

      - name: Test Varve.Sparql
        run: dotnet test --project tests/Varve.Sparql.Tests/Varve.Sparql.Tests.csproj --configuration Release

      - name: Test Varve.Sparql.Results
        run: dotnet test --project tests/Varve.Sparql.Results.Tests/Varve.Sparql.Results.Tests.csproj --configuration Release

      - name: Test Varve.Sparql.Evaluation
        run: dotnet test --project tests/Varve.Sparql.Evaluation.Tests/Varve.Sparql.Evaluation.Tests.csproj --configuration Release

      - name: Test Varve.Sparql.Store
        run: dotnet test --project tests/Varve.Sparql.Store.Tests/Varve.Sparql.Store.Tests.csproj --configuration Release

      - name: Run the W3C suites
        continue-on-error: true
        run: >
          dotnet test
          --project tests/Varve.Conformance.Tests/Varve.Conformance.Tests.csproj
          --configuration Release
          --report-trx
          --results-directory ${{ github.workspace }}/artifacts/conformance

      - name: Ratchet
        run: dotnet run eng/ratchet.cs -- ${{ github.workspace }}/artifacts/conformance --label publish

      - name: Native AOT
        run: |
          dotnet publish tests/Varve.AotSmoke --configuration Release \
            --output ${{ github.workspace }}/artifacts/aot
          "${{ github.workspace }}/artifacts/aot/Varve.AotSmoke"

      - name: Browser WASM
        run: dotnet build tests/Varve.WasmSmoke --configuration Release

      # Varve.Store.Browser is one of the packages this pushes, and these are
      # its only tests (ADR 0084). Same steps and browser as ci.yml's
      # browser-tests job.
      - name: Build the browser storage test app
        run: dotnet build tests/Varve.Store.BrowserTests --configuration Release

      - name: Browser storage in headless Chromium
        env:
          VARVE_CHROME: ${{ vars.VARVE_CHROME || '/usr/bin/google-chrome' }}
        run: dotnet run eng/browser-tests.cs

      - name: Changelog
        # ADR 0102: CHANGELOG.md is the projection of releases/, the tagged
        # version's descriptor folded in.
        run: dotnet run eng/changelog.cs -- --check

      - name: Release notes
        # The tag's descriptor, releases/<version>.yaml: its summary is the
        # GitHub Release's notes and "<version> — <title>" its title. Read here,
        # before anything is pushed, so a tag with no descriptor fails while
        # nothing is permanent; the release job below publishes them once the
        # push has succeeded.
        run: dotnet run eng/release.cs -- --notes "$GITHUB_REF_NAME" --into "${{ github.workspace }}/artifacts/release"

      - name: Pack
        run: >
          dotnet pack Varve.slnx
          --configuration Release
          --no-build
          -p:ContinuousIntegrationBuild=true
          --output ${{ github.workspace }}/artifacts/packages

      - name: Check the package metadata
        run: dotnet run eng/package-metadata.cs -- ${{ github.workspace }}/artifacts/packages

      - name: Check the package version against the tag
        # MinVer takes the version from the tag, but only from a tag it
        # recognises: a missing MinVerTagPrefix or a shallow clone both pack
        # 0.0.0-alpha.0.N without failing anything. A version cannot be
        # replaced once pushed, so the file names are checked here.
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=0
          for package in "${{ github.workspace }}"/artifacts/packages/*.nupkg; do
            case "$(basename "$package")" in
              *."$version".nupkg) echo "ok  $(basename "$package")" ;;
              *) echo "::error::$(basename "$package") is not version $version"; status=1 ;;
            esac
          done
          exit $status

      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: ${{ github.workspace }}/artifacts/packages
          if-no-files-found: error

      # The two steps below are adjacent on purpose. The key NuGet/login mints
      # lives one hour, and anything between them is something that can fail
      # while a credential is in flight.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        # --skip-duplicate so that re-running a half-successful publish does not
        # fail on the packages that already went up. A tag that published two of
        # three packages and cannot be retried is the failure to avoid.
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # The container image (ADR 0111), after the gates: the Native AOT binary
  # published on a native runner per architecture, built into the chiseled
  # image and pushed by digest; the manifest job joins the two, tags the
  # release's version (and latest for a version with no prerelease part),
  # attests build provenance and an SPDX SBOM for the manifest's digest, and
  # verifies both as an operator would.
  image:
    name: image (${{ matrix.rid }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            platform: linux/amd64
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/hafeok/varve

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Publish the server
        run: >
          dotnet publish src/Varve.Server
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output ${{ github.workspace }}/artifacts/server-aot

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}/artifacts/server-aot
          file: src/Varve.Server/container/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ matrix.rid }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: image manifest, attested
    needs: image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      IMAGE: ghcr.io/hafeok/varve

    steps:
      - name: Download the digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest
        # The tag is the release descriptor's version (ADR 0102); latest only
        # for a version with no prerelease part (ADR 0111 point 6).
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(--tag "$IMAGE:$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags+=(--tag "$IMAGE:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$GITHUB_REF_NAME\` is \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Verify, as an operator would
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://$IMAGE@${{ steps.manifest.outputs.digest }}" --owner hafeok | tee -a "$GITHUB_STEP_SUMMARY"
          gh attestation verify "oci://$IMAGE@${{ steps.manifest.outputs.digest }}" --owner hafeok --predicate-type https://spdx.dev/Document/v2.3 | tee -a "$GITHUB_STEP_SUMMARY"

  # The GitHub release for the tag, with its descriptor's summary as the notes.
  # A separate job so that contents: write is never held by the job that runs
  # the build and the tests, and after publish, so that a release is never
  # created for a version that did not reach nuget.org. Re-runnable on its own.
  # Created by the gates App, never by GITHUB_TOKEN (ADR 0102): the App made
  # the tag, and the identity map says the maintainer decides, the App
  # executes (ADR 0087). The gates environment admits v* tags for this job.
  release:
    needs: publish
    runs-on: ubuntu-latest
    environment: gates

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The previous tag, for the notes' compare link.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Release notes
        run: dotnet run eng/release.cs -- --notes "$GITHUB_REF_NAME" --into "$RUNNER_TEMP/release"

      - name: Mint the gates App's token
        id: gates
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATES_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gates.outputs.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [ "$(cat "$RUNNER_TEMP/release/prerelease.txt")" = "true" ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$(cat "$RUNNER_TEMP/release/title.txt")" \
            --notes-file "$RUNNER_TEMP/release/notes.md" \
            "${prerelease[@]}"
