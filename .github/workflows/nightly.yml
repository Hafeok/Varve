# The store's searches at their full depth, every night on main (#126).
#
# Some of the store's tests search a space wider than a pull request can wait
# for. On a pull request each explores a share of it; here, every variable in
# docs/testing.md section 8 is set, and each explores the whole: as much as
# the gate explored before #126, or more. The property each test proves is the
# same at either depth.
#
# Not a required check: it runs after the commits it tests have landed. A red
# night is a defect on main, found the next morning instead of never. #129 may
# make this run a release's gate.
#
# The long properties and the REC gate's long runs (#13) run here too, with
# VARVE_LONG_PROPERTIES set: the land gate runs their sized iteration counts,
# and this runs them in full. A failure is a defect to fix on main, never a
# reason to lower the land gate's counts.
#
# No container: the suites here run in process. The services legs keep their
# own job in ci.yml and its images in .github/ci-images.yaml.
name: Nightly

on:
  schedule:
    # 02:41 UTC every day: off the hour, as GitHub asks of scheduled workflows.
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  store:
    name: store, full depth (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Line endings
        # As the build job: the bytes tested are the bytes committed (ADR 0036).
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build tests/Varve.Store.Tests/Varve.Store.Tests.csproj --configuration Release

      - name: Temporary folder on the runner's temporary drive
        # As the build job (#126): the tests' temporary folder on D:, not C:.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Test Varve.Store at full depth
        # The pull request's depth runs in the build job; this is the rest.
        # Each value covers the whole of its search (docs/testing.md §8). The
        # crash during recovery at stride 1 runs alone for most of an hour on
        # Windows with no other test ending, so the hang dump waits longer.
        timeout-minutes: 150
        env:
          VARVE_FAULT_RECOVERY_STRIDE: "1"
          VARVE_FAULT_PROCESS_STRIDE: "1"
          VARVE_FAULT_BATCH_STRIDE: "1"
          VARVE_FAULT_POWER_STRIDE: "1"
          VARVE_OBJECT_FAULT_SWEEP_STRIDE: "1"
          # Extent maintenance's release-gate depths (section 7).
          VARVE_EXTENT_SCHEDULES: "400"
          VARVE_READER_SCHEDULES: "1200"
          VARVE_EXTENT_FAULTS_FULL: "1"
          VARVE_CACHE_DAMAGE_STRIDE: "1"
          VARVE_EXTENT_DAMAGE_STRIDE: "1"
          # Verified derived data (ADR 0213, #146).
          VARVE_MIDREAD_DAMAGE_STRIDE: "1"
          VARVE_ENVELOPE_DAMAGE_STRIDE: "1"
          VARVE_SPILL_DAMAGE_STRIDE: "1"
        run: >
          dotnet test
          --project tests/Varve.Store.Tests/Varve.Store.Tests.csproj
          --configuration Release
          --no-build
          --report-trx
          --results-directory ${{ github.workspace }}/artifacts/test-results/Varve.Store.Tests
          --hangdump
          --hangdump-timeout 100m

      - name: Store test durations
        if: always()
        run: >
          dotnet run eng/test-durations.cs --
          ${{ github.workspace }}/artifacts/test-results/Varve.Store.Tests
          --label "Varve.Store.Tests at full depth on ${{ matrix.os }}"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-nightly-${{ matrix.os }}
          path: ${{ github.workspace }}/artifacts/test-results
          if-no-files-found: warn

  long:
    name: long properties (${{ matrix.project }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      VARVE_LONG_PROPERTIES: "1"
    strategy:
      fail-fast: false
      matrix:
        project: [Varve.Derivation.Tests, Varve.Shacl.Tests, Varve.Shacl.Sparql.Tests, Varve.Shacl.Store.Tests]

    steps:
      - name: Line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The SHACL suites and REC's shapes are submodules.
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test ${{ matrix.project }}, long
        run: >
          dotnet test
          --project tests/${{ matrix.project }}/${{ matrix.project }}.csproj
          --configuration Release
          --report-trx
          --results-directory ${{ github.workspace }}/artifacts/test-results/${{ matrix.project }}

      - name: Test durations
        if: always()
        run: >
          dotnet run eng/test-durations.cs --
          ${{ github.workspace }}/artifacts/test-results/${{ matrix.project }}
          --label "${{ matrix.project }}, long"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-nightly-${{ matrix.project }}
          path: ${{ github.workspace }}/artifacts/test-results
          if-no-files-found: warn
