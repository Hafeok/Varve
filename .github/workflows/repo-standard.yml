# Keeps this repository's settings matching .github/repo-standard.yaml.
#
# ADR 0039. On a push to main that changes the declaration, `apply`; every week,
# `check`, and when it finds drift, open the issue titled "Configuration drift"
# or comment on it if it is already open.
#
# INERT UNTIL .github/repo-standard.yaml EXISTS. Every job's first step looks for
# the file and, when it is absent, ends the job green having done nothing: no
# token is minted, no setting is read or changed. The file is the maintainer's
# to add; nothing in the commit that introduced this workflow adds it.
#
# The tool is built from source, from tools/repo-standard in this checkout,
# rather than through its Action: there is no release of it to download until
# it has a home of its own.
#
# The token. The workflow's own GITHUB_TOKEN cannot change a repository's
# settings — GitHub never grants it the Administration permission — so a GitHub
# App's installation token is minted for each run by
# actions/create-github-app-token. The maintainer creates the App (repository
# permissions: Administration read and write, Actions read, Environments read,
# Secrets read, Issues read and write, Discussions read; organisation Projects
# read and write only if an organisation owns a declared board), installs it on
# this repository, and adds two repository secrets:
#
#   REPO_STANDARD_APP_CLIENT_ID    the App's client ID
#   REPO_STANDARD_APP_PRIVATE_KEY  a private key generated for the App
#
# The drift issue is opened with the workflow's own GITHUB_TOKEN, which is all
# that needs.

name: Repository settings

on:
  push:
    branches: [main]
    paths:
      - .github/repo-standard.yaml
      - tools/repo-standard/baselines/**
  schedule:
    # Mondays, 05:23 UTC: off the hour, as GitHub asks of scheduled workflows.
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      command:
        description: plan, apply or check
        required: true
        default: plan
        type: choice
        options: [plan, apply, check]

permissions:
  contents: read

# One run at a time: two applies racing each other would each plan against a
# state the other is changing.
concurrency:
  group: repo-standard
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DECLARATION: .github/repo-standard.yaml

jobs:
  repo-standard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Is there a declaration?
        id: declaration
        shell: bash
        run: |
          if [ -f "$DECLARATION" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No $DECLARATION in this repository; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Which command
        if: steps.declaration.outputs.present == 'true'
        id: command
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.command }}
        run: |
          case "$EVENT" in
            push) echo "name=apply" >> "$GITHUB_OUTPUT" ;;
            schedule) echo "name=check" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo "name=$REQUESTED" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac

      - name: Set up .NET
        if: steps.declaration.outputs.present == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build repo-standard from source
        if: steps.declaration.outputs.present == 'true'
        run: dotnet build tools/repo-standard/src/RepoStandard --configuration Release

      - name: Mint a token for the App
        if: steps.declaration.outputs.present == 'true'
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.REPO_STANDARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPO_STANDARD_APP_PRIVATE_KEY }}

      # Exit 1 is a difference: drift for check, a failed write for apply.
      # Exit 2 is could not run. Both fail the job; only a check's 1 opens the
      # drift issue, because an issue saying "drift" about a run that could not
      # read the settings would be wrong.
      - name: repo-standard ${{ steps.command.outputs.name }}
        if: steps.declaration.outputs.present == 'true'
        id: run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          COMMAND: ${{ steps.command.outputs.name }}
        run: |
          set +e
          dotnet run --project tools/repo-standard/src/RepoStandard --configuration Release --no-build -- \
            "$COMMAND" --repo "$GITHUB_REPOSITORY" --file "$DECLARATION"
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Open or update the drift issue
        if: failure() && steps.command.outputs.name == 'check' && steps.run.outputs.exit == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Configuration drift"
          body="The weekly \`repo-standard check\` found this repository's settings differ from \`$DECLARATION\`. The report is in the run's summary: $RUN_URL

          Either \`apply\` the declaration (push a change to it, or run this workflow with \`apply\`), or change the declaration to describe what the settings should now be."

          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)

          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still drifting: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
