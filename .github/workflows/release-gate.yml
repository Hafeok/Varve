# The release gate (ADR 0214 point 6, ADR 0215 point 6): what a release must
# pass beyond ci.yml, which the land gate cannot wait for.
#
#   mode     a preview, 0.x.y-preview.N, does not run the long gates inline;
#            any other release does (ADR 0215, amended 2026-11-02:
#            eng/release-freshness.cs --mode).
#   faults   the file backend's four faults at every point, on simulated and
#            on real files, on Linux and Windows (ADR 0214). Inline only.
#   soak     the soak under the shipped runtime configuration, judged by
#            Varve.Benchmarks --soak-judge (ADR 0215): four hours on Linux.
#            Inline only.
#   fresh on main
#            a release refuses when the latest Windows soak on main's nightly
#            is red or older than eight days; a preview also when the latest
#            Linux soak is (eight days), or the latest store at full depth on
#            either runner, which holds the faults at every point (three
#            days) (eng/release-freshness.cs).
#
# Called by release.yml at the commit under release, beside ci.yml, with the
# release's version; and by nightly.yml for its soaks, without one.

name: Release gate

on:
  workflow_call:
    inputs:
      ref:
        description: The commit under test
        type: string
        required: true
      version:
        description: The release's version; a preview checks main's runs instead of running the faults and the Linux soak. Empty for a caller that is not a release
        type: string
        default: ""
      faults:
        description: Run the faults at full depth
        type: boolean
        default: true
      soak-os:
        description: The runner the soak runs on; empty for none
        type: string
        default: ubuntu-latest
      soak-minutes:
        description: How long the soak runs
        type: number
        default: 240
      fresh-on-main:
        description: Refuse unless main's latest runs the version needs are green and fresh (the Windows soak; for a preview, the Linux soak and the store at full depth too)
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  mode:
    name: release gate mode
    runs-on: ubuntu-latest
    outputs:
      inline: ${{ steps.mode.outputs.inline }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Inline, or fresh from main
        id: mode
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet run eng/release-freshness.cs -- --mode --version "$VERSION"

  faults:
    name: faults (${{ matrix.os }})
    needs: mode
    if: inputs.faults && needs.mode.outputs.inline == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build tests/Varve.Store.Tests/Varve.Store.Tests.csproj --configuration Release

      - name: Temporary folder on the runner's temporary drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: The faults at every point
        # Every variable of the faults in docs/testing.md section 8, at 1.
        timeout-minutes: 280
        env:
          VARVE_FAULT_RECOVERY_STRIDE: "1"
          VARVE_FAULT_PROCESS_STRIDE: "1"
          VARVE_FAULT_BATCH_STRIDE: "1"
          VARVE_FAULT_POWER_STRIDE: "1"
          VARVE_FAULT_TORN_STRIDE: "1"
          VARVE_FAULT_SECTOR_STRIDE: "1"
          VARVE_FAULT_DISKFULL_STRIDE: "1"
          VARVE_FAULT_REAL_POWER_STRIDE: "1"
          VARVE_FAULT_KILL_STRIDE: "1"
        run: >
          dotnet test
          --project tests/Varve.Store.Tests/Varve.Store.Tests.csproj
          --configuration Release
          --no-build
          --filter-namespace Varve.Store.Tests.Faults
          --report-trx
          --results-directory ${{ github.workspace }}/artifacts/test-results/faults
          --hangdump
          --hangdump-timeout 240m

      - name: Fault test durations
        if: always()
        run: >
          dotnet run eng/test-durations.cs --
          ${{ github.workspace }}/artifacts/test-results/faults
          --label "The faults at every point on ${{ matrix.os }}"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-gate-faults-${{ matrix.os }}
          path: ${{ github.workspace }}/artifacts/test-results
          if-no-files-found: warn

  soak:
    name: soak (${{ inputs.soak-os }})
    needs: mode
    if: inputs.soak-os != '' && needs.mode.outputs.inline == 'true'
    runs-on: ${{ inputs.soak-os }}
    # The soak, the build before it, and the judge after it, inside GitHub's
    # six-hour limit for a job.
    timeout-minutes: 340

    steps:
      - name: Line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the soak
        run: dotnet build tests/Varve.Benchmarks/Varve.Benchmarks.csproj --configuration Release

      - name: Soak under the shipped runtime configuration
        # ADR 0110: workstation concurrent GC, ConserveMemory 5, from
        # src/Varve.Server/ShippedRuntime.props, which the benchmark imports
        # as the server does; the soak prints what the runtime reports and the
        # judge refuses any other (ADR 0215). A vocabulary the writer fills by
        # minute 30.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/soak
          dotnet run --project tests/Varve.Benchmarks/Varve.Benchmarks.csproj --configuration Release --no-build -- \
            --soak ${{ inputs.soak-minutes }} --policy --subjects 2000 | tee artifacts/soak/soak.csv

      - name: Judge the soak
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Soak, ${{ inputs.soak-minutes }} minutes on ${{ inputs.soak-os }}"
            echo
            echo '```'
            dotnet run --project tests/Varve.Benchmarks/Varve.Benchmarks.csproj --configuration Release --no-build -- --soak-judge artifacts/soak/soak.csv
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the soak's samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: soak-${{ inputs.soak-os }}
          path: artifacts/soak
          if-no-files-found: warn

  fresh-on-main:
    name: fresh on main
    if: inputs.fresh-on-main
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Main's latest runs the version needs are green and fresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: dotnet run eng/release-freshness.cs -- --repository ${{ github.repository }} --version "$VERSION"
