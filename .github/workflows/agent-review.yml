# Agent review (ADR 0087).
#
# THE HAZARD. A pull request that can change the code judging it judges
# itself: one that edits eng/agent-review.cs to `return 0;`, or this file to
# skip it, passes. A `pull_request` or `pull_request_review` run takes its
# workflow and its checkout from the pull request, so neither can be trusted
# with this check. And a required check is matched by name, so any pull
# request can add a job called `agent review` that passes.
#
# THE RULE. The verdict is a check run named `agent review`, created or
# updated on the pull request's head by the gates GitHub App (checks: write
# only), and ruleset 1 requires that name *from that App* (ADR 0088). Its
# token is minted from the `gates` environment, whose secrets only `main` and
# the maintainer-only `land/**` branches can reach, so no workflow a pull
# request defines can post it. The job that posts it:
#
#   - runs only on triggers whose workflow comes from main:
#     pull_request_target, issue_comment (a comment created, edited or
#     deleted), and a push to land/**, which only the maintainer may push
#     (ruleset `land`);
#   - checks out main and runs main's eng/agent-review.cs, never the pull
#     request's: no ref from the pull request is checked out, fetched, built
#     or run;
#   - reads the pull request (head, commits, identity map, comments) through
#     the API, as data.
#
# Review submissions are not a trigger and are not consulted: the approval is
# a conversation comment that is the approval line and nothing else, with the
# head's full sha, never edited, by a holder of Approve for every agent in the
# pull request (eng/lib/Approvals.cs; ADR 0087, amended 2026-11-12, #290).
# That form is not a valid workflow, only tolerated until the ledger's review
# gate exists; the pull request that adopts it removes it (ADR 0087).
#
# A WITHDRAWN APPROVAL. The check on a head is the last one posted, so it must
# be posted again whenever an approval could have stopped counting: when a
# comment is edited, which makes it approve nothing, and when it is deleted.
# An edit's event carries the body as it is now, so the job also asks what the
# body was before (`changes.body.from`): an approval edited into anything else
# no longer contains the word, and must still start a run.
#
# No job here runs on `pull_request`, and none may: its workflow would come
# from the pull request (eng/agent-review-tamper.cs holds this).

name: Agent review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: ["land/**"]

permissions: {}

concurrency:
  group: agent-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # The verdict ruleset 1 reads: the gates App's check run `agent review`.
  judge:
    name: agent review (judge)
    if: >
      github.event_name == 'pull_request_target'
      || github.event_name == 'push'
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && (contains(github.event.comment.body, 'approve')
              || contains(github.event.changes.body.from, 'approve')))
    runs-on: ubuntu-latest
    environment: gates

    permissions:
      contents: read
      pull-requests: read
      issues: read
      # A land/ push of agent commits is admitted when its head is an
      # approved pull request's: its check runs and pull requests are read.
      checks: read

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # main, by name, on every path: never the pull request's head or
          # merge ref, and never the pushed land/ commit. On a land/ push the
          # whole history is fetched, the pushed commit's included, so that
          # git can read a landing train's merges (#277): read as data, never
          # checked out, built or run.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false

      - name: Set up .NET
        # Not ./.github/actions/setup-dotnet: the checkout above is main's,
        # which need not hold this branch's copy of the action, and a judge
        # that cannot set up fails every land/ push that changes it. It judges
        # with main's code and restores nothing, so global.json's SDK with its
        # roll-forward is enough here (ADR 0224).
        # sdk-pin: exempt (main's checkout, restores nothing; eng/sdk-pin.cs)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Mint the gates App's token
        id: gates
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATES_APP_PRIVATE_KEY }}

      - name: Judge with main's eng/agent-review.cs, and post the check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATES_TOKEN: ${{ steps.gates.outputs.token }}
          GATES_CHECK_NAME: agent review
        run: dotnet run eng/agent-review.cs
