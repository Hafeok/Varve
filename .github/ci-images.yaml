# The third-party container images CI starts, and the single list of them
# (#118). Each is pinned by the digest of its manifest (an index, for every
# image here: all platforms) and, unless `mirror: false`, copied by
# .github/workflows/mirror-ci-images.yml to a private package of this
# repository, ghcr.io/hafeok/varve-ci/<name>, with that digest unchanged.
#
#   name      the mirror's package, under ghcr.io/hafeok/varve-ci/
#   upstream  the registry, repository and tag it is copied from; the tag is
#             for the reader and for the weekly comparison, the digest is
#             what is pulled
#   digest    the manifest digest, the same upstream and in the mirror
#   licence   what the image is licensed under, and where that is stated
#   jobs      the CI jobs that start it, by the name they report
#   why       what the job needs it for
#   mirror    false keeps the image upstream; `reason` then says why
#   seeded    a copy made by hand, and why (ADR 0099, amendment 2026-10-19)
#   allowances  where code outside .github/ names the upstream image: the
#             file, and the CI job that overrides it to the mirror
#   watch     where the weekly comparison reads the tag instead of upstream,
#             by manifest HEAD only, when upstream refuses CI's reads; the
#             only place Docker Hub may be named (ADR 0099, amendment
#             2026-10-20). The mirror still copies from upstream.
#
# Every reference under .github/ is the mirror's, at the digest here, or the
# upstream's for a `mirror: false` row; eng/ci-images.cs checks it, and the
# C# that starts containers (CONTRIBUTING.md, "CI's test containers").
#
# Bumping an image is a pull request to this file and to the reference that
# pulls it, at the same digest; on main, the change re-mirrors. The weekly
# ci-images-upstream workflow says when an upstream tag has moved. A new row
# comes out public on its first copy, so that run is red: the maintainer sets
# the package private and re-runs it.
#
# Not here, by decision: the devcontainer's base image and the server
# Dockerfile's chiseled base. Neither is a test container CI starts, and the
# chiseled base is the shipped image's, whose provenance names its registry
# (ADR 0111).

images:
  - name: postgres
    upstream: public.ecr.aws/docker/library/postgres:18.6-alpine
    digest: sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    licence: PostgreSQL Licence (https://www.postgresql.org/about/licence/); the official image's packaging is MIT, and its Alpine base carries its packages' own licences
    jobs: [auth (zitadel), container (linux-x64)]
    why: Zitadel's database, for auth test layer (c) (ADR 0100)
    watch: docker.io/library/postgres:18.6-alpine
    seeded: >-
      By hand, on 2026-10-19, by the maintainer, from
      docker.io/library/postgres at this digest: ECR Public's anonymous data
      cap refused every pull from CI's runners and from the maintainer's
      machine. The source is not the image's identity, the digest is; the
      mirror workflow checks this package's digest as it checks any other.
      CI pulls it from the mirror already (.github/zitadel/compose.yaml).

  - name: zitadel
    upstream: ghcr.io/zitadel/zitadel:v4.19.4
    digest: sha256:90a3045b80a2b5b395e1e770302076906af3a5911225af7c464b4f3bd00d0a1b
    licence: AGPL-3.0 (https://github.com/zitadel/zitadel/blob/main/LICENSE); mirrored unmodified, in a private package
    jobs: [auth (zitadel), container (linux-x64)]
    why: a real OIDC provider, for auth test layer (c) (ADR 0100)

  - name: mock-oauth2-server
    upstream: ghcr.io/navikt/mock-oauth2-server:6.0.4
    digest: sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
    licence: MIT (https://github.com/navikt/mock-oauth2-server/blob/master/LICENSE)
    jobs: [auth (mock-oauth2), container (linux-x64), aspire sample, storage (services), fleet (services)]
    why: >-
      a standards mock issuer, for auth test layer (b) (ADR 0100); the
      Aspire sample's issuer, which the sample's AppHost starts itself
      (ADR 0117); and the issuer RustFS exchanges web identity for, so that
      the storage legs reach it as a server does (ADR 0137, #165)
    allowances:
      - file: samples/Varve.Aspire.Sample/Program.cs
        job: aspire sample

  - name: azurite
    upstream: mcr.microsoft.com/azure-storage/azurite:3.37.0
    digest: sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    licence: MIT (https://github.com/Azure/Azurite/blob/main/LICENSE)
    jobs: [samples (eventhubs), storage (services), fleet (services)]
    why: >-
      the Event Hubs emulator's metadata and checkpoint store (ADR 0146);
      Azure Blob Storage for the object-storage legs (ADR 0134); and the
      fleet's shared store (ADR 0163)

  - name: rustfs
    upstream: ghcr.io/rustfs/rustfs:1.0.1
    digest: sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    licence: Apache-2.0 (https://github.com/rustfs/rustfs/blob/main/LICENSE)
    jobs: [storage (services), fleet (services)]
    why: the S3-compatible server of the object-storage legs, which the contract suite chose (ADR 0134, decision 6)

  - name: eventhubs-emulator
    upstream: mcr.microsoft.com/azure-messaging/eventhubs-emulator:2.2.1
    digest: sha256:be413f0d59541621879e6d197d73f64f3b3ac5fa45861641fdc1430252b8b44b
    licence: Microsoft proprietary EULA (https://github.com/Azure/azure-event-hubs-emulator-installer/blob/main/EMULATOR_EULA.md)
    jobs: [samples (eventhubs)]
    why: the Event Hubs bridge sample's test (ADR 0146)
    mirror: false
    reason: >-
      Its licence is a proprietary EULA, and a copy we host, even a private
      one, is a redistribution question we need not answer: mcr.microsoft.com
      has no anonymous pull limit and has not failed CI. It is pulled from
      there, at this digest.
