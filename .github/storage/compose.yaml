# The object stores of the storage legs (ADR 0134): Azurite for Azure Blob
# Storage and RustFS for the S3-compatible adapter, each on a loopback port.
# Started by the workflow, never by a test or a package (ADR 0099).
#
#   docker compose -f .github/storage/compose.yaml up -d
#
# Tests read VARVE_AZURITE=http://127.0.0.1:10000/devstoreaccount1 and
# VARVE_RUSTFS=http://127.0.0.1:9000,varvetest,varvetestsecret. The RustFS key
# is a loopback development key and nothing else (ADR 0137): it opens a
# throwaway server bound to 127.0.0.1.
#
# RustFS is CI's S3-compatible server because the contract suite chose it
# (ADR 0134, decision 6): it passed the storage contract suite and both race
# properties five runs in five; SeaweedFS passed three and exhausted its
# volumes on the others.
#
# Pinned by digest, each a multi-architecture index (linux/amd64 and
# linux/arm64), resolved when this file was written (2026-10-15):
# mcr.microsoft.com and ghcr.io have no anonymous pull limit; nothing comes
# from Docker Hub.
#
# Each digest is also in .github/ci-images.yaml, the list the CI image mirror
# copies from (#118): a bump changes both.

name: varve-storage

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000"]
    ports:
      - "127.0.0.1:10000:10000"

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: varvetest
      RUSTFS_SECRET_KEY: varvetestsecret
    ports:
      - "127.0.0.1:9000:9000"
