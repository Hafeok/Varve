<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>Button — preview</title>
<style>html,body{margin:0}body.vw-root{padding:16px}.cases{display:grid;gap:16px}.case{margin:0}.case figcaption{margin-bottom:4px;font-size:11px;line-height:16px;color:var(--ink-muted)}</style></head>
<body class="vw-root">
<!-- One figure per contract case in cases/: the markup inside each data-case
     element is the case's, verbatim, and a test checks it (ADR 0206 point 6). -->
<div class="cases">
<figure class="case"><figcaption>danger</figcaption><div data-case="danger"><button class="vw-button vw-button--danger" type="button">Close dataset</button></div></figure>
<figure class="case"><figcaption>danger-solid</figcaption><div data-case="danger-solid"><button class="vw-button vw-button--danger-solid" type="button">Close notes</button></div></figure>
<figure class="case"><figcaption>disabled</figcaption><div data-case="disabled"><button class="vw-button" type="button" disabled>Take checkpoint</button><span class="vw-muted">Only the writer takes checkpoints.</span></div></figure>
<figure class="case"><figcaption>primary</figcaption><div data-case="primary"><button class="vw-button vw-button--primary" type="button">Take checkpoint</button></div></figure>
<figure class="case"><figcaption>quiet</figcaption><div data-case="quiet"><button class="vw-button" type="button">Open dataset</button></div></figure>
<figure class="case"><figcaption>small</figcaption><div data-case="small"><button class="vw-button vw-button--small" type="button">Return to head</button></div></figure>
</div>
</body>
</html>
