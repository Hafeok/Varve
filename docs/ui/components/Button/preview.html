<!doctype html>
<html lang="en">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>Button — preview</title>
<style>html,body{margin:0}body.vw-root{padding:16px}</style></head>
<body class="vw-root">
<style>.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}</style>
<div class="row">
  <button class="vw-button vw-button--primary" type="button">Take checkpoint</button>
  <button class="vw-button" type="button">Open dataset</button>
  <button class="vw-button vw-button--danger" type="button">Close dataset</button>

  <span class="vw-muted">Only the writer takes checkpoints.</span>
