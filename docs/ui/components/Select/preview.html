<!doctype html>

<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../bundle.css"><title>Select — preview</title>
<style>html,body{margin:0}body.vw-root{padding:16px}.cases{display:grid;gap:16px}.case{margin:0}.case figcaption{margin-bottom:4px;font-size:11px;line-height:16px;color:var(--ink-muted)}</style></head>
<body class="vw-root">
<!-- One figure per contract case in cases/: the markup inside each data-case
     element is the case's, verbatim, and a test checks it (ADR 0206 point 6).

<div class="cases">
<figure class="case"><figcaption>default</figcaption><div data-case="default"><div class="vw-field"><label for="f-regime">Entailment</label><select id="f-regime"><option value="simple">simple</option><option value="rdfs" selected>rdfs</option></select></div></div></figure>
<figure class="case"><figcaption>disabled</figcaption><div data-case="disabled"><div class="vw-field"><label for="f-regime-d">Entailment</label><select id="f-regime-d" disabled aria-describedby="f-regime-d-help"><option value="simple" selected>simple</option></select><span class="vw-field__help" id="f-regime-d-help">No TBox binding covers this dataset's graphs.</span></div></div></figure>
<figure class="case"><figcaption>help</figcaption><div data-case="help"><div class="vw-field"><label for="f-asof-kind">As of</label><select id="f-asof-kind" aria-describedby="f-asof-kind-help"><option value="head" selected>The head</option><option value="position">A position</option><option value="time">A time</option></select><span class="vw-field__help" id="f-asof-kind-help">A time reads the last commit at or before it.</span></div></div></figure>
</div>
