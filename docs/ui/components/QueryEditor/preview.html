PREFIX notes: &lt;https://notes.example/notes/&gt;
PREFIX xsd: &lt;http://www.w3.org/2001/XMLSchema#&gt;
# Titles of the notes created this week
SELECT DISTINCT ?note ?title WHERE {
  GRAPH ?g { ?note a notes:Note ; dct:title ?title ; dct:created ?d . }
  FILTER (?d &gt;= &quot;2026-10-20&quot;^^xsd:date &amp;&amp; LANG(?title) = &quot;en&quot;)
  OPTIONAL { ?note dct:creator _:who }
}
ORDER BY DESC(?d) LIMIT 500</textarea></div></div><span class="vw-field__help" id="q-help">Tab inserts two spaces. Press Escape, then Tab, to leave the editor.</span></div></div></figure>
