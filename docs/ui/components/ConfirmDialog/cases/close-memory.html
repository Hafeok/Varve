<dialog class="vw-dialog" aria-labelledby="dlg-title"><div class="vw-dialog__body"><h2 class="vw-dialog__title" id="dlg-title">Close scratch?</h2><p class="vw-dialog__effect">Every instance stops serving <strong>scratch</strong> and its writer releases the dataset. Reads and writes answer <code>404</code> until it is opened again. Its data is lost: Memory storage keeps nothing once the dataset is closed.</p><div class="vw-field"><label for="dlg-name">Type <code>scratch</code> to confirm</label><input id="dlg-name" autocomplete="off" spellcheck="false" value=""></div></div><div class="vw-dialog__foot"><button class="vw-button" type="button">Cancel</button><button class="vw-button vw-button--danger-solid" type="button" disabled>Close scratch</button></div></dialog>
