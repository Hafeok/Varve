name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - run: echo build

  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo lint
