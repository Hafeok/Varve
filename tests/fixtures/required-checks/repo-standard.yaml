# Six required checks; see README.md for which fail and why.
rulesets:
- name: trunk
  rules:
  - type: required_status_checks
    parameters:
      required_status_checks:
      - context: build (ubuntu-latest)
      - context: build (macos-latest)
      - context: lint
      - context: nightly
      - context: approved
        integration_id: 99
      - context: signed
        integration_id: 99
      - context: reviewed
