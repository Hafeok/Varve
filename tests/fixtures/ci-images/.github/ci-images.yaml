# The fixture's list: one kept upstream, one allowed in C#, one watched on
# Docker Hub, and one whose upstream is on Docker Hub.

images:
  - name: kept
    upstream: ghcr.io/example/kept:1.0
    digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    licence: MIT
    jobs: [fixture]
    why: a mirrored image

  - name: outside
    upstream: mcr.microsoft.com/example/outside:2.0
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    licence: proprietary
    jobs: [fixture]
    why: an image kept upstream
    mirror: false
    reason: >-
      Its licence does not allow a copy.

  - name: allowed
    upstream: ghcr.io/example/allowed:3.0
    digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    licence: MIT
    jobs: [fixture job]
    why: an image C# starts
    allowances:
      - file: samples/Allowed.cs
        job: fixture job

  - name: watched
    upstream: mcr.microsoft.com/example/watched:4.0
    digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    licence: MIT
    jobs: [fixture]
    why: an image whose upstream refuses reads, watched on Docker Hub
    watch: docker.io/library/watched:4.0

  - name: hubbed
    upstream: docker.io/library/hubbed:5.0
    digest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
    licence: MIT
    jobs: [fixture]
    why: fails, an upstream on Docker Hub
