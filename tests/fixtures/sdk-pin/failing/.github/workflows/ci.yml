# The sdk-pin gate's failing fixture: each rule broken once (README.md).
name: fixture
on: push
jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        # A reason, but not the marker: still a finding.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
      - name: Install the WebAssembly workloads
        run: dotnet workload install wasm-tools wasm-experimental
