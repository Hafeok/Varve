# The composite action itself, which the gate does not read: it is the one
# place .NET is set up and workloads installed.
name: fixture
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    - shell: bash
      run: dotnet workload install wasm-tools
